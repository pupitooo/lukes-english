<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Build</title>
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--dim:#7d8590;--acc:#4493f8;--ok:#3fb950;--bad:#f85149;--amb:#d29922;--card:#161b22;--line:#30363d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace}
main{max-width:820px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:1.5rem;margin:0;color:var(--ok)}.sub{color:var(--dim);margin:2px 0 16px}
h2{color:var(--ok);margin:0}h3{color:var(--acc);margin:18px 0 4px;font-size:1rem}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.hud{display:flex;justify-content:space-between;color:var(--acc);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:#21262d;border-radius:3px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.stem{font-size:1.15rem;margin:4px 0 14px}.stem b{color:var(--amb)}
.opts{display:grid;gap:8px}
.opt{font:inherit;text-align:left;background:#0d1117;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:9px 12px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}.opt.ok{border-color:var(--ok);background:#0f2e1a}.opt.bad{border-color:var(--bad);background:#3a1416}
.k{color:var(--acc);margin-right:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}#typed{flex:1;min-width:0;width:100%;font:inherit;background:#0d1117;color:var(--amb);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.next{font:inherit;background:transparent;color:var(--acc);border:1px solid var(--acc);border-radius:6px;padding:7px 14px;cursor:pointer;margin-top:8px}
.fb{margin-top:12px}.y{color:var(--ok)}.n{color:var(--bad)}.note{display:block;color:var(--dim);margin-top:3px}
#log{margin-top:14px;font-size:.92rem;word-break:break-word}.c{color:#30363d}.p{color:var(--ok)}.x{color:var(--bad)}
.rank{font-size:1.7rem;color:var(--amb);margin:6px 0}
.miss{border-left:3px solid var(--bad);padding:4px 10px;margin:8px 0}.miss b{color:var(--amb)}.miss small{display:block;color:var(--dim)}
.hidden{display:none}
</style></head><body><main>

const MAP=[[/\bcan't\b/g,'can not'],[/\bcannot\b/g,'can not'],[/\bwon't\b/g,'will not'],[/\bshan't\b/g,'shall not'],
[/n't\b/g,' not'],[/\bi'm\b/g,'i am'],[/'re\b/g,' are'],[/'s\b/g,' is'],[/'ve\b/g,' have'],[/'ll\b/g,' will']];
function base(s){s=' '+s.toLowerCase().replace(/[‘’`´]/g,"'").replace(/[^a-z0-9' ]+/g,' ')+' ';
 for(const [r,t] of MAP) s=s.replace(r,t); return s;}
function forms(s){const b=base(s);return [b.replace(/'d\b/g,' would'),b.replace(/'d\b/g,' had')]
 .map(x=>' '+x.replace(/'/g,'').replace(/\s+/g,' ').trim()+' ');}
function matches(typed,accept){const ys=forms(typed);
 return accept.some(a=>a.split('|').every(p=>{const f=forms(p)[0].trim();return ys.some(y=>y.includes(' '+f+' '));}));}

const raw=Uint8Array.from(atob(BLOB),c=>c.charCodeAt(0)),K=new TextEncoder().encode('green-build-1947');
const D=JSON.parse(new TextDecoder().decode(raw.map((b,i)=>b^K[i%K.length])));const Q=D.q,R=D.r;
let i=0,score=0,answered=false;const miss=[],got=[];
const $=id=>document.getElementById(id);
const h=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');const bold=s=>h(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
function logline(){$('log').innerHTML=R.map((l,n)=>got[n]===true?'<span class="p">'+h(l)+'</span>':got[n]===false?'<span class="x">[corrupted]</span>':'<span class="c">'+'#'.repeat(Math.min(l.length,18))+'</span>').join(' ');}
function hud(){$('blk').textContent='test '+String(i+1).padStart(2,'0')+'/20';$('acc').textContent=score+' passed';$('prog').style.width=(i/20*100)+'%';}
function show(){answered=false;hud();const q=Q[i];let b='';
 if(q.t==='m'){b='<p class="stem">'+bold(q.s)+'</p><div class="opts">'+q.o.map((o,n)=>'<button class="opt" data-n="'+n+'"><span class="k">'+(n+1)+'</span>'+h(o)+'</button>').join('')+'</div>';}
 else{b='<p class="stem">'+bold(q.cz)+'</p><div class="row"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="type the English"><button class="next" id="go">check</button></div>';}
 $('card').innerHTML=b+'<div class="fb" id="fb"></div>';
 if(q.t==='m'){document.querySelectorAll('.opt').forEach(x=>x.onclick=()=>pick(+x.dataset.n));}
 else{const t=$('typed');t.focus();$('go').onclick=typed;t.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();typed();}};}}
function result(ok,right,you){answered=true;got[i]=ok;if(ok)score++;else miss.push({n:i+1,q:Q[i].s||Q[i].cz,r:right,w:Q[i].w,y:you});
